[runtime]
sampler = moped
verbosity = standard

[DEFAULT]
2PT_FILE = ${COSMOSIS_3PCF_INTEGRATOR}/data/dv/real_2pt_desy3_unblind_g2flip_matchElisa_2025Mar10.fits
run_name = 2pt-nozbin4
group_name = moped-compress
output_dir = not-used

[pipeline]
modules =  consistency  bbn_consistency
           camb  fast_pt
           fits_nz  source_photoz_bias
           IA_NLA
           pk_to_cl
           add_intrinsic
           2pt_shear
           shear_m_bias
           2pt_like
timing=T
debug=T
priors = ${COSMOSIS_3PCF_INTEGRATOR}/config/unblind-metacal-796sims-february-Percival-2ptfix-3pcfsc-noz4/des-y3-flatdz4priors.ini
values = ${COSMOSIS_3PCF_INTEGRATOR}/config/unblind-metacal-796sims-february-Percival-2ptfix-3pcfsc-noz4/des-y3-shear-values-fixedz4.ini
extra_output = cosmological_parameters/sigma_8 cosmological_parameters/sigma_12 data_vector/2pt_chi2

[output]
filename = data/moped/moped-%(group_name)s-%(RUN_NAME)s.txt
format=text
privacy = F

%include ${COSMOSIS_3PCF_INTEGRATOR}/config/astrophysical.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/cosmo.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/cosmic-shear.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/linear-power.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/sampler.ini

%include ${COSMOSIS_3PCF_INTEGRATOR}/config/unblind-metacal-796sims-february-Percival-2ptfix-3pcfsc-noz4/des-y3-scale-cuts-nozbin4.ini
