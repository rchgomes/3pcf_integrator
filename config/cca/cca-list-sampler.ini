[runtime]
sampler = test
; sampler = multinest
sampler = list

[DEFAULT]
2PT_FILE = ${COSMOSIS_3PCF_INTEGRATOR}/data/dv/sim_2pt-NLA-cosmoDESY3.fits
MAP3_FILE = ${COSMOSIS_3PCF_INTEGRATOR}/data/dv/sim_map3-NLA-cosmoDESY3.fits
run_name = map3-samples
group_name = cca
output_dir = ${COSMOSIS_3PCF_INTEGRATOR}/output/%(GROUP_NAME)s

[list]
filename = ${COSMOSIS_3PCF_INTEGRATOR}/output/test-desy3c-moped-run/des-y3-2pt.txt

[pipeline]
modules =  consistency  bbn_consistency
           camb  
;           fast_pt
           fits_nz  source_photoz_bias
;           IA_NLA
;           pk_to_cl
;           add_intrinsic
;           2pt_shear
;           shear_m_bias
;           2pt_like
           map3_binning
;           fastnc 
;           nc_to_map3
           fastnc_emulate
           map3_m_bias
           map3_like
;           2pt_moped_like
;           2pt_mask
;           map3_mask
;           joint_2pt_moped_like
timing=T
debug=T
priors = ${COSMOSIS_STD_LIB}/examples/des-y3-priors.ini
values = ${COSMOSIS_3PCF_INTEGRATOR}/config/%(GROUP_NAME)s/des-y3-shear-values.ini
extra_output =  map3/map3-bin_1_1_1#4 
                map3/map3-bin_1_1_2#4
                map3/map3-bin_1_1_3#4
                map3/map3-bin_1_1_4#4
                map3/map3-bin_1_2_2#4
                map3/map3-bin_1_2_3#4
                map3/map3-bin_1_2_4#4
                map3/map3-bin_1_3_3#4
                map3/map3-bin_1_3_4#4
                map3/map3-bin_1_4_4#4 
                map3/map3-bin_2_2_2#4 
                map3/map3-bin_2_2_3#4 
                map3/map3-bin_2_2_4#4 
                map3/map3-bin_2_3_3#4 
                map3/map3-bin_2_3_4#4 
                map3/map3-bin_2_4_4#4 
                map3/map3-bin_3_3_3#4 
                map3/map3-bin_3_3_4#4 
                map3/map3-bin_3_4_4#4 
                map3/map3-bin_4_4_4#4 
fast_slow = T
; first_fast_module = shear_m_bias
; For some use cases this might be faster:
;first_fast_module=lens_photoz_width

[output]
filename = %(output_dir)s/%(RUN_NAME)s.txt
format=text
privacy = F

[test]
save_dir=%(output_dir)s/%(RUN_NAME)s
fatal_errors=T

%include ${COSMOSIS_3PCF_INTEGRATOR}/config/3pt.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/astrophysical.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/cosmo.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/cosmic-shear.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/linear-power.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/sampler.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/joint.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/moped.ini

; replace the settings of included files for this analysis
[map3_binning]
sample_combinations = all

[joint_2pt_moped_like]
covariance_realizations = 400
