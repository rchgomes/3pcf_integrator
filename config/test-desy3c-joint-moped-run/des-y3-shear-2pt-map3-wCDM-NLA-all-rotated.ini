[runtime]
sampler = multinest
; sampler = test
verbosity = standard

[DEFAULT]
2PT_FILE = ${COSMOSIS_3PCF_INTEGRATOR}/data/dv/blind-metacal-2pt-DESY3.fits'
MAP3_FILE = ${COSMOSIS_3PCF_INTEGRATOR}/data/dv/sim_map3-NLA-cosmoDESY3.fits
run_name = 2pt-map3-wCDM-all-rotated
group_name = test-desy3c-joint-moped-run
output_dir = ${COSMOSIS_3PCF_INTEGRATOR}/output/%(GROUP_NAME)s
; covariance
2PT_NSIM = -1
MAP3_NSIM = 400
;JOINT_NSIM = 400
; ndim reduces effectively from 227+80 -> 80
; This is equivalent to have hartlap factor from (400-80-2)/(400-1)
; This can be mimiced by setting n = 1124, so that (n-227-2)/(n-1) = (400-80-2)/(400-1)
JOINT_NSIM = 1124

[pipeline]
modules =  consistency  bbn_consistency
           camb  fast_pt
           fits_nz  source_photoz_bias
           IA_NLA
           pk_to_cl
           add_intrinsic
           2pt_shear
           shear_m_bias
           2pt_like
           map3_binning
;           fastnc 
;           nc_to_map3
           fastnc_emulate
           map3_like
           2pt_mask
           map3_mask
           joint_like
           joint_moped_like
likelihoods = joint_moped
timing=T
debug=T
priors = ${COSMOSIS_STD_LIB}/examples/des-y3-priors.ini
values = ${COSMOSIS_3PCF_INTEGRATOR}/config/%(GROUP_NAME)s/des-y3-shear-values-wCDM.ini
extra_output = cosmological_parameters/sigma_8 cosmological_parameters/sigma_12 data_vector/2pt_chi2 data_vector/map3_chi2
fast_slow = T
first_fast_module = shear_m_bias
; For some use cases this might be faster:
;first_fast_module=lens_photoz_width

[output]
filename = %(output_dir)s/des-y3-%(RUN_NAME)s.txt
format=text
privacy = F

[test]
save_dir=%(output_dir)s/des-y3-%(RUN_NAME)s
fatal_errors=T

%include ${COSMOSIS_3PCF_INTEGRATOR}/config/3pt.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/astrophysical.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/cosmo.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/cosmic-shear.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/linear-power.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/sampler.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/joint.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/moped.ini

; replace the settings of included files for this analysis
[map3_binning]
sample_combinations = all

[joint_like]
data_file = ${COSMOSIS_3PCF_INTEGRATOR}/data/covariance/cov_xip_xim_map3_rotated.fits

[joint_moped_like]
data_file = ${COSMOSIS_3PCF_INTEGRATOR}/data/moped/moped-moped-compress-2pt-map3-all-rotated.txt
