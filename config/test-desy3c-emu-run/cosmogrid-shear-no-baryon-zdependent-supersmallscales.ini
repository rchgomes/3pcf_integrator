[runtime]
; sampler = multinest
sampler = test
verbosity = standard

[DEFAULT]
2PT_FILE = ${COSMOSIS_3PCF_INTEGRATOR}/data/dv/sim_2pt-NLA.fits
MAP3_FILE = ${COSMOSIS_3PCF_INTEGRATOR}/data/dv/sim_map3-NLA.fits
run_name = map3-no-baryon-zdependent
group_name = test-desy3c-emu-run
output_dir = ${COSMOSIS_3PCF_INTEGRATOR}/output/%(GROUP_NAME)s

[pipeline]
modules =  consistency camb nz_source map3_binning_zslice fastnc nc_to_map3
timing=T
debug=T
priors = ${COSMOSIS_STD_LIB}/examples/des-y3-priors.ini
values = ${COSMOSIS_3PCF_INTEGRATOR}/config/%(GROUP_NAME)s/cosmogrid-shear-values-nobaryon.ini
extra_output = map3/map3-bin_0.01#4
               map3/map3-bin_0.1#4
               map3/map3-bin_0.5#4
               map3/map3-bin_1.0#4
               map3/map3-bin_1.5#4
               map3/map3-bin_2.0#4
fast_slow = F
first_fast_module = shear_m_bias
; For some use cases this might be faster:
;first_fast_module=lens_photoz_width

[output]
filename = %(output_dir)s/des-y3-%(RUN_NAME)s.txt
format=text
privacy = F

[test]
save_dir=%(output_dir)s/des-y3-%(RUN_NAME)s
fatal_errors=T

[nz_source]
file = ${COSMOSIS_STD_LIB}/number_density/load_nz_fits/load_nz_fits.py
nz_file = ${COSMOSIS_3PCF_INTEGRATOR}/data/2pt_NG_final_2ptunblind_02_24_21_wnz_redmagic_covupdate.fits
data_sets = source

[source_photoz_bias]
file = ${COSMOSIS_STD_LIB}/number_density/photoz_bias/photoz_bias.py
mode = additive
sample = nz_source
bias_section = wl_photoz_errors
interpolation = linear

%include ${COSMOSIS_3PCF_INTEGRATOR}/config/3pt.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/astrophysical.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/cosmo.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/cosmic-shear.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/linear-power.ini
%include ${COSMOSIS_3PCF_INTEGRATOR}/config/sampler.ini


; replace the settings of included files for this analysis

[fastnc]
file = ${COSMOSIS_3PCF_INTEGRATOR}/python/fastnc_interface.py
Lmax = 50
Mmax = 100
nfft = 150
projection=cent
dlnt = 0.253758
use-pixwin = T
nside = 1024
mu = 0 1 2 3
n-phi-bin = 60
phi-min = 0.01570796
phi-max = 3.12588469
n-theta-bin = 9
theta-min = 8.15147113
theta-max = 62.0703205
use_cache = T
NLA = T

[map3_binning_zslice]
file = ${COSMOSIS_3PCF_INTEGRATOR}/python/map3_binning_zslice.py
theta_filter_1 = 7.0 14.0 25.0 40.0
theta_filter_2 = 7.0 14.0 25.0 40.0
theta_filter_3 = 7.0 14.0 25.0 40.0
sample_combinations= 0.01 0.1 0.5 1.0 1.5 2.0